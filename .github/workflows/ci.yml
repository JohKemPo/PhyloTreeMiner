name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip

      - name: Instalar dependências de teste
        run: |
          python -m pip install --upgrade pip
          pip install fastapi uvicorn python-multipart python-dotenv psutil \
                      biopython dendropy pandas numpy ijson neo4j \
                      pytest pytest-asyncio httpx

      - name: pytest
        working-directory: Backend
        run: python -m pytest tests -m "not slow"

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Frontend/phylotreeminer
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: Frontend/phylotreeminer/package-lock.json

      - run: npm ci
      - run: npm run lint:ratchet
      - run: npm run test -- --run
      - run: npm run build
