[pytest]
testpaths = tests
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
addopts = -q --strict-markers
markers =
    golden: caracteriza a saída atual de um endpoint pesado
    oracle: confronta a zona sagrada contra dendropy/ete3
    security: fecha um vetor da auditoria (S-*)
    slow: exige artefatos grandes ou execução de pipeline
filterwarnings =
    ignore::DeprecationWarning
