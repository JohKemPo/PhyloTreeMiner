# Servido pelo container "frontend" (ver Frontend/Dockerfile e
# docker-compose.yml). Duas responsabilidades:
#
#   1. Fallback de SPA — o app usa roteamento client-side (react-router ou
#      equivalente); sem isso, um F5 em qualquer rota que não "/" devolve 404
#      do próprio nginx em vez de deixar o React resolver a rota.
#   2. Proxy reverso para o backend, por nome de serviço do compose
#      ("backend"), nunca por localhost — o processo do nginx roda num
#      container próprio, sem acesso à rede do host.
#
# NOTA: hoje o frontend ainda fala direto com http://localhost:8000 (F-2/Arq-C,
# fora do escopo deste lote — ver Frontend/phylotreeminer/src/__tests__/config.test.js).
# Este proxy cobre as rotas /api e /ws já usadas por Backend/src/app.py e fica
# pronto para quando o frontend passar a usar caminho relativo.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        proxy_pass http://backend:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /ws/ {
        proxy_pass http://backend:8000/ws/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
    }
}
