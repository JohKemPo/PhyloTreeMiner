# Servido pelo container "frontend" (ver Frontend/Dockerfile e
# docker-compose.yml). Duas responsabilidades:
#
#   1. Fallback de SPA — o app usa roteamento client-side (react-router ou
#      equivalente); sem isso, um F5 em qualquer rota que não "/" devolve 404
#      do próprio nginx em vez de deixar o React resolver a rota.
#   2. Proxy reverso para o backend, por nome de serviço do compose
#      ("backend"), nunca por localhost — o processo do nginx roda num
#      container próprio, sem acesso à rede do host.
#
# NOTA (M5, DEC-086/DEC-087): Backend/src/app.py expõe duas famílias de rota —
# tudo em /api/* e /ws/* (cobertas abaixo desde a primeira versão deste
# arquivo) e um punhado de rotas de topo sem prefixo (/browse, /dataFolders,
# /file, /inputs_data, /projects*, /upload-data, /uploaded-data — levantadas
# com `grep '@app\.(get|post|...)'` em app.py). Sem proxy para essas últimas,
# o frontend não podia migrar para caminho relativo sem quebrar dentro do
# container. Um único location por regex cobre as duas formas de cada rota
# (com e sem sufixo, ex. /projects e /projects/{nome}/rerun).

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        proxy_pass http://backend:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /ws/ {
        proxy_pass http://backend:8000/ws/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
    }

    # Rotas de topo sem prefixo /api — ver nota no cabeçalho do arquivo.
    # `proxy_pass http://backend:8000;` sem caminho no destino preserva o URI
    # original inteiro (inclusive querystring), então `/browse?path=x` chega
    # ao backend exatamente como chegou ao nginx.
    location ~ ^/(browse|dataFolders|file|inputs_data|projects|upload-data|uploaded-data)(/.*)?$ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
