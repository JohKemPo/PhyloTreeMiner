# Ambiente conda do PhyloTreeMiner.
#
# Crie com `bash scripts/setup_env.sh` — não com `conda env create` direto, para
# que a verificação de binários rode junto e o env nunca seja o `base`.
#
# Uma fonte só para as dependências Python: a seção `pip` aponta para
# `requirements.txt`. Duplicar a lista aqui criaria duas verdades que divergem
# no primeiro `pip install` — o mesmo defeito que D5 custou caro.
#
# Os canais são conda-forge e bioconda, nessa ordem, e `defaults` fica de fora:
# ele conflita com bioconda na resolução e exige licença para uso organizacional.
#
# **As versões são pinadas.** Sem pino, duas máquinas que rodam `make setup` em
# datas diferentes recebem o que o canal tiver no dia — foi o que ocorreu entre a
# máquina de desenvolvimento e a de validação (RAxML-NG 1.2.2 × 2.0.2, MUSCLE
# 3.8 × 5.3, interfaces incompatíveis). Ao subir uma versão, suba aqui, registre
# no ledger e reexecute o que dependia dela: a versão da ferramenta faz parte do
# resultado, não do ambiente.

name: phylotreeminer

channels:
  - conda-forge
  - bioconda

dependencies:
  - python=3.10
  - pip

  # ---------------------------------------------------------------- #
  # Ferramentas externas de bioinformática.
  #
  # O nome do binário NÃO acompanha o nome do pacote de forma estável:
  # `iqtree` 3.x instala `iqtree` e `iqtree3`, e **não** instala `iqtree2`.
  # Por isso o código resolve o binário entre os nomes possíveis em vez de
  # fixar um — ver workflow/utils/external_tools.py.
  # ---------------------------------------------------------------- #
  - mafft=7.526
  - clustalo=1.2.4
  - muscle=5.3
  - fasttree=2.2.0
  - iqtree=3.1.3
  - raxml-ng=2.0.2
  - mrbayes=3.2.7

  # Precisa vir do conda: o wheel do PyQt5 não resolve em toda arquitetura,
  # e o ete3 o exige para renderizar.
  - pyqt=5.15.11

  - pip:
      - -r requirements-dev.txt
